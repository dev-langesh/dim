- name: Ensure destination directory exists
  file:
    path: "{{ app_dir }}"
    state: directory

- name: Check if destination directory exists
  stat:
    path: "{{ app_dir }}"
  register: dir_stat

- name: Check if directory is not empty
  find:
    paths: "{{ app_dir }}"
    file_type: any
    recurse: no
  when: dir_stat.stat.exists
  register: dir_contents

- name: Fail if destination directory is not empty
  fail:
    msg: "The destination directory {{ app_dir }} is not empty. Aborting."
  when: dir_contents.matched > 0

- name: Copy zip file
  copy:
    src: "{{ source_code }}"
    dest: "{{ app_dir }}/{{ app_name }}.zip"

- name: Unzip file to target
  unarchive:
    src: "{{ app_dir }}/{{ app_name }}.zip"
    dest: "{{ app_dir }}"
    remote_src: yes
    extra_opts: [ "-j" ]

- name: Delete zip file
  file:
    path: "{{ app_dir }}/{{ app_name }}.zip"
    state: absent