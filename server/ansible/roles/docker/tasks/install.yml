- name: Check supported OS
  assert:
    that:
      - ansible_facts['distribution'] in ['Ubuntu', 'Debian', 'CentOS']
    fail_msg: "Unsupported OS. Supported distributions are Ubuntu, Debian, and CentOS."

- name: Install Docker (Ubuntu)
  include_tasks: install_ubuntu.yml
  when: ansible_facts['distribution'] == 'Ubuntu'
  
- name: Start and enable Docker
  service:
    name: docker
    state: started
    enabled: yes
