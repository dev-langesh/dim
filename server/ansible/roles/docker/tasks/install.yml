- name: Debug installation
  debug:
    msg: "Installing Docker on {{ ansible_facts['distribution'] }} version {{ ansible_facts['distribution_version'] }}"

- name: Check supported OS
  fail:
    msg: "Unsupported OS. Supported distributions are Ubuntu, Debian, CentOS, Fedora, and RedHat."
  when: ansible_facts['distribution'] not in ['Ubuntu', 'Debian', 'CentOS', "RedHat", "Fedora"]

- name: Get total system memory in MB
  ansible.builtin.shell: "cat /proc/meminfo | awk '/MemAvailable/ {print int($2 / 1024)}'"
  register: available_ram
  changed_when: false

- name: Get available disk space in MB
  ansible.builtin.shell: "df --output=avail / | tail -1 | awk '{print int($1 / 1024)}'"
  register: available_disk
  changed_when: false

- name: Debug RAM and disk values
  debug:
    msg: "RAM: {{ available_ram.stdout }} MB, Disk: {{ available_disk.stdout }} MB"

- name: Fail if available RAM is less than 1048 MB (1GB)
  fail:
    msg: "Insufficient RAM. At least 1GB is required, but only {{ available_ram.stdout }} MB is available."
  when: available_ram.stdout | int < 1048

- name: Fail if available disk space is less than 5GB
  fail:
    msg: "Insufficient disk space. At least 5GB is required, but only {{ available_disk.stdout }} MB is available."
  when: available_disk.stdout | int < 5120

- name: Install Docker (Ubuntu)
  include_tasks: install_ubuntu.yml
  when: ansible_facts['distribution'] == 'Ubuntu'

- name: Install Docker (Debian)
  include_tasks: install_debian.yml
  when: ansible_facts['distribution'] == 'Debian'

- name: Install Docker (RedHat)
  include_tasks: install_redhat.yml
  when: ansible_facts['distribution'] == 'RedHat'

- name: Install Docker (CentOS)
  include_tasks: install_centos.yml
  when: ansible_facts['distribution'] == 'CentOS'

- name: Install Docker (Fedora)
  include_tasks: install_fedora.yml
  when: ansible_facts['distribution'] == 'Fedora'
