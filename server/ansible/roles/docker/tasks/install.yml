- name: Install Docker (Debian)
  apt:
    name: docker.io
    state: present
    update_cache: yes
  when: ansible_facts['os_family'] == 'Debian'

- name: Install Docker (RedHat)
  yum:
    name: docker
    state: present
  when: ansible_facts['os_family'] == 'RedHat'

- name: Start and enable Docker
  service:
    name: docker
    state: started
    enabled: yes