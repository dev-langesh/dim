- name: Check if Docker is installed
  shell: docker 
  register: docker_check
  ignore_errors: true

- name: Install Docker
  include_tasks: install.yml
  when: docker_check.failed or docker_check.rc == 1

- name: Pull Docker image and deploy container
  include_tasks: deploy_image.yml
  when: build_docker_image is not defined or build_docker_image == false

- name: Build Docker image
  include_tasks: build_image.yml
  when: build_docker_image is defined and build_docker_image == true
