- name: Install Nginx (Debian)
  apt:
    name: nginx
    state: present
    update_cache: yes
  when: ansible_facts['os_family'] == 'Debian'

- name: Install Nginx (RedHat)
  yum:
    name: nginx
    state: present
  when: ansible_facts['os_family'] == 'RedHat'

- name: Install Nginx (Archlinux)
  pacman:
    name: nginx
    state: present
    update_cache: yes
  when: ansible_facts['os_family'] == 'Archlinux'