- name: Install Nginx
  apt:
    name: nginx
    state: present
    update_cache: yes
  when: ansible_facts['os_family'] == 'Debian'

- name: Install Nginx
  block:
    - name: Install nginx
      dnf:
        name: nginx
        state: present

    - name: Configure Firewall
      shell: |
        firewall-cmd --permanent --add-port={80/tcp,443/tcp}
        firewall-cmd --reload
      ignore_errors: true
      
    - name: Configure Nginx
      shell: |
        setsebool -P httpd_can_network_connect 1
      ignore_errors: true
  when: ansible_facts['os_family'] == 'RedHat'

- name: Start and Enable Nginx
  service:
    name: nginx
    state: started
    enabled: yes