- name: Install Nginx
  include_tasks: install.yml

- name: Create Nginx Access Log Directory
  file:
    path: /var/log/nginx/{{ domain_name }}
    state: directory
    mode: "0755"

- name: Configure Nginx
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/conf.d/{{ domain_name }}.conf
  notify: Reload Nginx
