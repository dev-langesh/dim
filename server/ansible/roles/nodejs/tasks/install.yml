# Step 1: Check if Node.js is already installed
- name: Check if Node.js is already installed
  command: node -v
  register: nodejs_check
  ignore_errors: true

# Step 2: Install prerequisites if not installed already
- name: Install prerequisites (Debian)
  apt:
    name: [curl, gnupg, ca-certificates]
    state: present
    update_cache: yes
  when:
    - ansible_facts['os_family'] == 'Debian'
    - nodejs_check.rc != 0

- name: Install prerequisites (RedHat)
  yum:
    name: [curl, gnupg2, ca-certificates]
    state: present
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - nodejs_check.rc != 0

- name: Install prerequisites (Archlinux)
  pacman:
    name: [curl, ca-certificates]
    state: present
    update_cache: yes
  when:
    - ansible_facts['os_family'] == 'Archlinux'
    - nodejs_check.rc != 0

# Step 3: Install Node.js only if not already installed
- name: Install Node.js (Debian/Ubuntu)
  shell: |
    curl -fsSL https://deb.nodesource.com/setup_{{ nodejs_version | default('lts') }}.x | bash -
    apt-get install -y nodejs
  when:
    - ansible_facts['os_family'] == 'Debian'
    - nodejs_check.rc != 0

- name: Install Node.js (RHEL/CentOS/Alma)
  shell: |
    curl -fsSL https://rpm.nodesource.com/setup_{{ nodejs_version | default('lts') }}.x | bash -
    yum install -y nodejs
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - nodejs_check.rc != 0

- name: Install Node.js (Arch Linux)
  shell: |
    pacman -Sy --noconfirm nodejs npm
  when:
    - ansible_facts['os_family'] == 'Archlinux'
    - nodejs_check.rc != 0

# Step 4: PM2 & App setup (always runs regardless of node state)
- name: Install PM2 globally
  npm:
    name: pm2
    global: yes

- name: Enable PM2 to start on boot
  command: pm2 startup

- name: Install app dependencies
  shell: npm install
  args:
    chdir: "{{ app_dir }}"
