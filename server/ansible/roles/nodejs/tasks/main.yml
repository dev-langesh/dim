- name: Install Nodejs and PM2
  include_tasks: install.yml

- name: Copy .env file
  copy:
    src: "{{ env_file }}"
    dest: "{{ source_dir }}/.env"
  when: env_file is defined

- name: Start Node app with PM2
  shell: |
    pm2 start npm --name {{ app_name }} -- run {{ app_start_script | default('start') }}
    pm2 save --force
  args:
    chdir: "{{ source_dir }}"
  environment:
    NODE_ENV: "{{ node_env | default('production') }}"