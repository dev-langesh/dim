- name: Install python (Debian)
  apt:
    name:
      - python3
      - python3-pip
      - python3-venv
    state: present
  when: ansible_facts['os_family'] == 'Debian'

- name: Install python (RedHat)
  dnf:
    name:
      - python3
      - python3-pip
      - python3-venv
    state: present
  when: ansible_facts['os_family'] == 'RedHat'

