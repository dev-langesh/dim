- name: Install Python 3 and pip
  include_tasks: install.yml

- name: Create a virtual environment
  command: python3 -m venv env
  args:
    chdir: "{{ source_dir }}"

- name: Install dependencies
  shell: |
    env/bin/pip install -r {{ requirements_file | default('requirements.txt') }}
    env/bin/pip install uvicorn gunicorn
  args:
    chdir: "{{ source_dir }}"

- name: Create systemd service file
  template:
    src: gunicorn.service.j2
    dest: /etc/systemd/system/{{ app_name }}.service
  notify: Reload systemd

- name: Start {{ app_name }} service
  shell: |
    systemctl start {{ app_name }} > /dev/null 2>&1 && echo "Service started"
    systemctl enable {{ app_name }} > /dev/null 2>&1 && echo "Service enabled"